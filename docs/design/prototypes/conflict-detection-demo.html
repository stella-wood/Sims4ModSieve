  {id:'bisect',icon:'bisect',name:'二分排查',description:'分批试运行，根据反馈逐步缩小范围'}
 ];
 return `<section class="entrance"><div class="entrance-heading"><h1>Mod 冲突检测</h1><span class="prototype-label">页面原型 · 示例数据</span></div><p class="entrance-subtitle">选择一种排查方式</p><div class="entrance-grid">${entries.map(e=>`<article class="entrance-card card"><div class="home-icon">${icon(e.icon)}</div><div class="card-heading"><h2>${e.name}</h2>${e.id==='basic'?'':'<span class="draft-label">流程草案</span>'}</div><p>${e.description}</p><button class="entrance-action" data-section="${e.id}">进入排查→</button></article>`).join('')}</div></section>`;
}
function conflict(){
 if(section==='overview')return overview();
 const name={basic:'基础排查',logs:'报错日志分析',health:'健康性检查',bisect:'二分排查'}[section];
 return `${section==='basic'?'':`<div class="section-return"><button class="back" data-section="overview">${icon('back')}返回冲突检测</button></div>`}<div class="page-heading subpage-heading"><h1>${name}</h1>${section==='basic'?'<p>查看资源覆盖与脚本模块碰撞</p>':'<span class="prototype-label">交互原型 · 流程草案</span>'}</div>${section==='basic'?basic():proposal()}`;
}
function basic(){const busy=state==='scanning';return `<div class="workspace"><aside class="left-column"><button class="back" data-section="overview">${icon('back')}返回冲突检测</button><div class="source-card card"><div class="row spread"><h2>检查范围</h2><button id="add-source" class="secondary" ${busy?'disabled':''}>${icon('plus')} 添加</button></div><div class="mods row"><div><strong>当前 Mods 文件夹</strong><div class="path" title="${esc(mods)}">${esc(mods)}</div></div><button id="change-mods" class="link" ${busy?'disabled':''}>更改</button></div><div class="sources">${sources.length?sources.map(s=>`<div class="source"><input type="checkbox" data-source="${s.id}" aria-label="启用来源 ${esc(s.name)}" ${s.enabled?'checked':''} ${busy?'disabled':''}><div class="source-text"><strong>${esc(s.name)}</strong><div class="path" title="${esc(s.path)}">${esc(s.path)}</div></div><button class="icon-button" data-remove="${s.id}" title="移除来源 ${esc(s.name)}" aria-label="移除来源 ${esc(s.name)}" ${busy?'disabled':''}>${icon('close')}</button></div>`).join(''):'<p class="muted small" style="padding-top:17px">添加一个文件夹作为检查来源</p>'}</div><div class="source-actions"><button id="clear-sources" ${busy||!sources.length?'disabled':''}>清空来源</button></div><div class="scan-status">${busy?`<div class="progress" role="progressbar" aria-label="模拟扫描进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><span style="width:${progress}%"></span></div>`:''}<strong id="status-text">${statusText()}</strong><p>${statusDetail()}</p><button id="scan" class="${busy?'secondary':'primary'}" ${!busy&&!sources.some(s=>s.enabled)?'disabled':''}>${busy?'取消扫描':'开始扫描'}</button></div></div></aside><section class="results card" aria-label="扫描结果"><header class="result-head"><div class="row spread"><h2>扫描结果</h2><div class="row"><span class="muted small">${state==='results'?'示例会话 '+session:''}</span><button id="expand-all" class="icon-button" title="展开或收起当前结果" aria-label="展开或收起当前结果" ${state!=='results'||view==='incomplete'?'disabled':''}>${icon('expand')}</button></div></div><p>${state==='results'?'资源按 TGI 分组 · 脚本按顶层包名折叠':'结果只对应当前扫描会话'}</p><div class="result-tabs" role="tablist" aria-label="结果类型">${[['resources','资源','4'],['scripts','脚本','2'],['incomplete','未完成分析',incomplete.length]].map(([id,name,count])=>`<button role="tab" aria-selected="${view===id}" class="${view===id?'active':''}" data-view="${id}">${name}<span>${state==='results'?count:'—'}</span></button>`).join('')}</div></header>${view!=='incomplete'?`<div class="filters"><label>状态</label>${['all','different','same','partial'].map(id=>`<button data-filter="${id}" class="${filter===id?'active':''}">${id==='all'?'全部':labels[id]}</button>`).join('')}</div>`:''}<div class="list" id="result-list">${results()}</div><footer class="result-footer">${footer()}</footer></section></div>`}
function statusText(){return {results:'扫描完成',initial:'准备扫描',scanning:'正在比较内容 · '+progress+'%',cancelled:'扫描已取消',empty:'扫描完成',failed:'扫描没有完成'}[state]}
function statusDetail(){return {results:`示例扫描 128 个文件 · ${incomplete.length} 个文件未完成分析`,initial:'检查 .package 与 .ts4script 文件',scanning:'示例进度 · 正在读取资源与脚本条目',cancelled:'本次分析未完成，可重新开始扫描',empty:'在本次已检查范围内未发现候选冲突',failed:'示例来源无法读取，请检查文件夹后重试'}[state]}
function footer(){if(state==='results')return view==='scripts'?'2 个顶层包 · 4 个碰撞模块；状态以模块比较结果为准':view==='incomplete'?`${incomplete.length} 个文件未完成分析 · 不将未完成项计为内容相同`:'4 个资源组 · 同一组可同时有内容差异与未完成项';return state==='empty'?'本次扫描已完成 · 未发现候选冲突':state==='scanning'?'扫描进行中 · 来源已锁定':state==='cancelled'?'取消不表示没有冲突':state==='failed'?'扫描失败 · 尚未得到完整结果':'选好来源后开始扫描'}
function results(){if(state!=='results'){const messages={initial:['尚未扫描','选择检查来源，开始比较资源与脚本模块'],scanning:['正在扫描','正在读取并比较内容，可随时取消'],cancelled:['扫描已取消','本次结果不完整。重新扫描会建立新的结果会话。'],empty:['未发现候选冲突','只表示本次检查范围内没有发现候选冲突'],failed:['扫描没有完成','示例原因：扫描来源无法读取。检查来源后重试。']};return `<div class="empty"><div>${icon('scan')}<h3>${messages[state][0]}</h3><p>${messages[state][1]}</p></div></div>`}
 if(view==='incomplete')return `<div class="notice">没查出冲突不代表它们没有冲突</div><p class="muted small" style="line-height:1.8;margin-bottom:4px">以下文件未完成全部分析。已取得的比较结果仍显示在资源或脚本分组中。</p>${incomplete.map(f=>`<article class="incomplete">${file(f.path)}<div class="reason">${f.reason}</div><p class="explanation">${f.scope}</p></article>`).join('')}`;
 if(view==='resources'){const rows=resources.filter(r=>filter==='all'||r.states.includes(filter));return rows.length?rows.map(r=>`<details class="group" data-group="${r.id}" ${openGroups.has(r.id)?'open':''}><summary>${icon('chevron','chevron')}<span class="group-name">${r.name}</span><span class="group-count">${r.count}</span><span class="badges">${r.states.map(badge).join('')}</span></summary><div class="group-body"><div class="row spread"><div class="technical">TGI ${r.tgi}</div><button class="copy" data-copy="${r.tgi}" title="复制 TGI" aria-label="复制 TGI">${icon('copy')}</button></div><p class="explanation">${r.text}</p>${r.buckets.map(b=>`<div class="bucket"><div class="bucket-label">${b.label}</div>${b.files.map(f=>file(f,b.reason)).join('')}</div>`).join('')}</div></details>`).join(''):'<div class="empty"><p>没有符合筛选条件的资源组</p></div>'}
 const groups=scripts.filter(s=>filter==='all'||s.modules.some(m=>m.states.includes(filter)));
 return groups.map(s=>{
  const modules=s.modules.filter(m=>filter==='all'||m.states.includes(filter));
  const counts=['different','same','partial'].map(k=>({state:k,count:modules.filter(m=>m.states.includes(k)).length})).filter(c=>c.count);
  return `<details class="group" data-group="script-${s.name}" ${openGroups.has('script-'+s.name)?'open':''}><summary>${icon('chevron','chevron')}<span class="group-name">${s.name}</span><span class="group-count">${modules.length} 个模块</span><span class="badges">${counts.map(c=>`<span class="tag ${c.state}">${labels[c.state]} ${c.count}</span>`).join('')}</span></summary><div class="group-body"><div class="technical">TopLevelName · ${s.name}</div><p class="explanation">状态按模块计数，可重叠；包名仅用于归组。</p>${modules.map(m=>`<details class="module" data-module="${m.name}" open><summary>${icon('chevron','chevron')}<span class="group-name">${m.name}</span><span class="badges">${m.states.map(badge).join('')}</span></summary><div class="files">${m.states.includes('different')?'<p class="explanation">该模块已读到 2 种内容，存在覆盖'+(m.states.includes('partial')?'；另有 1 份没比完':'')+'</p>':m.states.includes('same')?'<p class="explanation">该模块内容相同</p>':'<p class="explanation">尚未取得足够的内容，无法判断是否相同</p>'}${m.files.map((f,i)=>`<div class="bucket-label" style="margin-top:8px">${i===m.failedIndex?'未完成比较':m.states.includes('different')?'内容 '+(i?'B':'A'):m.states.includes('same')?'相同模块内容':'已读取内容'}</div>${file(f,i===m.failedIndex?m.reason:'')}`).join('')}</div></details>`).join('')}</div></details>`;
 }).join('')||'<div class="empty"><p>没有符合筛选条件的模块</p></div>';
}
const proposals={logs:{title:'从报错日志找到排查线索',intro:'拟议流程：选择游戏生成的日志，提取报错位置、模块名和关联文件。线索用于缩小范围，不自动认定某个 Mod 是原因。',steps:[['选择日志','选择 lastException.txt 或其他支持的日志；展示文件名、时间与识别结果。'],['读取报错线索','提取异常摘要和脚本调用位置；将可识别的模块与当前 Mods 文件对应。'],['查看关联文件','展开原始片段与关联依据；无法对应的线索单列，继续人工核对。']],bottom:'日志解析与文件关联尚未实现。此页展示拟议流程，不生成诊断结论。',button:'查看日志展示示例',dialog:'拟议示例：异常类型 → 模块名 garden_tools.actions → 对应文件 GardenTools_v2.ts4script。关联只说明日志提到了该模块，不能据此确定原因。'},health:{title:'检查文件是否可读、可分析',intro:'拟议流程：检查 package 结构、脚本归档及读取支持情况。检查结果只描述文件状态，不代表游戏兼容性。',steps:[['确认检查范围','沿用基础排查的来源设置；开始扫描后锁定来源，并显示进度与取消入口。'],['检查文件结构','区分结构异常、无法读取与暂不支持的压缩方式；保留具体原因。'],['核对未完成项','按文件汇总发现与影响范围；无法检查的文件不标为通过。']],bottom:'底层已有部分读取与预检能力；独立健康性检查流程和界面尚未接入。',button:'查看分类示例',dialog:'拟议分类：结构异常（索引越界）；无法读取（文件被占用）；暂不支持（RefPack 资源内容）。不支持的项不等同于文件损坏。'},bisect:{title:'通过分批试运行缩小范围',intro:'拟议流程：保存排查范围与恢复信息，将候选分批试运行，根据玩家反馈继续缩小范围。正式文件操作方案待确认。',steps:[['准备与备份','确认候选文件、退出游戏、保存恢复信息，并规划每轮试运行范围。'],['分批试运行','展示当前轮次和待测试批次；由玩家启动游戏并复现原来的问题。'],['记录反馈','记录“仍有问题”“未复现”或“无法判断”，继续排查或结束并恢复。']],bottom:'二分排查尚未实现。原型不会禁用、移动或恢复任何文件。',button:'查看反馈示例',dialog:'拟议轮次：128 个候选 → 本轮测试 64 个。玩家选择“仍有问题”后才推进下一轮；“无法判断”保留当前轮次。多 Mod 共同作用时不能按单一问题文件直接推断。'}};
function proposal(){const d=proposals[section];return `<section class="proposal"><div class="proposal-intro card"><div class="row proposal-title"><h2>${d.title}</h2><span class="tag same">流程草案 · 尚未实现</span></div><p>${d.intro}</p></div><div class="workflow">${d.steps.map((s,i)=>`<article class="step card"><div class="step-number">0${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></article>`).join('')}</div><div class="proposal-bottom card"><p>${d.bottom}</p><button id="proposal-preview" class="secondary" style="flex:none">${d.button}</button></div></section>`}
function setState(next){clearInterval(timer);timer=null;state=next;if(next==='scanning'){session++;progress=8;openGroups.clear();timer=setInterval(()=>{progress=Math.min(progress+7,100);if(progress===100){clearInterval(timer);timer=null;state='results';openGroups.add('resource-mixed');}render();},700)}render()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;if(page==='conflicts')section='overview';render()});document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-group]').forEach(d=>d.ontoggle=()=>{if(d.open)openGroups.add(d.dataset.group);else openGroups.delete(d.dataset.group)});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);notify('已复制到剪贴板')}catch{info('完整内容',b.dataset.copy)}});document.querySelectorAll('[data-source]').forEach(c=>c.onchange=()=>{sources.find(s=>s.id===Number(c.dataset.source)).enabled=c.checked;render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{sources=sources.filter(s=>s.id!==Number(b.dataset.remove));if(!sources.length)setState('initial');else render()});const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};on('clear-sources',()=>{sources=[];setState('initial');notify('来源已清空，结果会话已重置')});on('add-source',()=>{sourceId++;sources.push({id:sourceId,name:'示例来源 '+sourceId,path:'D:\\ModSamples\\Collection_'+sourceId,enabled:true});render();notify('已添加模拟文件夹；实际应用将打开文件夹选择器')});on('change-mods',()=>info('更改 Mods 文件夹','此处沿用重复检测的 Mods 路径选择。原型仅展示模拟路径，不读取或更改本地设置。'));on('scan',()=>setState(state==='scanning'?'cancelled':'scanning'));on('expand-all',()=>{const details=[...document.querySelectorAll('.group')];const shouldOpen=details.some(d=>!d.open);details.forEach(d=>{d.open=shouldOpen;if(shouldOpen)openGroups.add(d.dataset.group);else openGroups.delete(d.dataset.group)})});on('proposal-preview',()=>info(proposals[section].button,proposals[section].dialog));}
document.getElementById('demo-state').onchange=e=>{page='conflicts';section='basic';if(e.target.value==='results')openGroups.add('resource-mixed');setState(e.target.value)};
document.getElementById('dialog-close').onclick=()=>document.getElementById('info-dialog').close();
render();
</script>
</body>
</html>
