name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      SIMS4_CONFLICT_REVIEW_DIR: ${{ github.workspace }}/artifacts/ci/screenshots/conflict
      SIMS4_DETECTION_REVIEW_DIR: ${{ github.workspace }}/artifacts/ci/screenshots/detection
      SIMS4_SCROLLBAR_REVIEW_DIR: ${{ github.workspace }}/artifacts/ci/screenshots/scrollbars
      SIMS4_SETTINGS_REVIEW_DIR: ${{ github.workspace }}/artifacts/ci/screenshots/settings
      SIMS4_WPF_FAILURE_DIR: ${{ github.workspace }}/artifacts/ci/screenshots/failures
      SIMS4_UPDATE_SCREENSHOTS: ${{ github.workspace }}/artifacts/ci/screenshots/update

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore Sims4ModSieve.sln --locked-mode

      - name: Check known dependency vulnerabilities
        shell: pwsh
        run: ./eng/check-vulnerabilities.ps1

      - name: Build Release
        run: dotnet build Sims4ModSieve.sln -c Release --no-restore --nologo

      - name: Run tests
        run: dotnet test Sims4ModSieve.sln -c Release --no-build --no-restore --nologo --logger trx --results-directory artifacts/ci/test-results

      - name: Package self-contained Windows x64 installer
        shell: pwsh
        run: |
          ./eng/package-installer.ps1
          ./eng/test-portable-bundle.ps1 -SkipArchive
          ./eng/test-installer.ps1 -ReviewUi

      - name: Upload installer and hash
        uses: actions/upload-artifact@v7
        with:
          name: Sims4ModSieve-win-x64
          path: |
            artifacts/release/Sims4ModSieve-*-setup.exe
            artifacts/release/Sims4ModSieve-*-setup.exe.sha256
            artifacts/release/vulnerabilities.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows x64 debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: Sims4ModSieve-win-x64-symbols
          path: |
            src/Sims4ModSieve.Desktop/bin/Release/net10.0-windows/win-x64/Sims4ModSieve.pdb
            src/Sims4ModSieve.Core/bin/Release/net10.0/Sims4ModSieve.Core.pdb
            src/Sims4ModSieve.Packages/bin/Release/net10.0/Sims4ModSieve.Packages.pdb
          if-no-files-found: error
          retention-days: 7

      - name: Upload test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-diagnostics
          path: artifacts/ci/
          if-no-files-found: ignore
          retention-days: 7
